name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 決定版本號
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: 編譯並打包
        run: |
          swift --version
          bash scripts/build.sh

      - name: 上傳 DMG（每次推送）
        uses: actions/upload-artifact@v4
        with:
          name: TokenMeter-${{ env.VERSION }}
          path: build/TokenMeter-*.dmg

      - name: 發佈到 Releases（最新版）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: TokenMeter ${{ env.VERSION }}
          make_latest: true
          files: build/TokenMeter-*.dmg
          body: |
            下載下方的 `TokenMeter-${{ env.VERSION }}.dmg`，打開後把 TokenMeter 拖進 Applications。
            第一次打開如果被擋下：系統設定 → 隱私權與安全性 → 仍要打開。
